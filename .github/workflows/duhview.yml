name: duhview
# On demand only: duhview reviews a pull request when the owner, a member or a collaborator
# comments "@duhview review" on it, or replies in one of its review threads. It does not run on
# every push, because each review costs model calls.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    # Only for a trusted person's comment on a pull request that mentions @duhview or replies in a
    # review thread. duhview's own comments carry a hidden "<!-- duhview" marker and are skipped.
    if: >-
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      (contains(github.event.comment.body, '@duhview') || github.event.comment.in_reply_to_id) &&
      !contains(github.event.comment.body, '<!-- duhview') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    concurrency:
      group: duhview-comment-${{ github.event.comment.id }}
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: tags and branches can be moved to different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: iamsachin/duhview@b60beb12c116cedf68c802aa5dd8e2413fab2fa7 # main, 2026-11-07
        with:
          github-token: ${{ secrets.DUHVIEW_TOKEN || github.token }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
