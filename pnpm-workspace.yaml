packages:
  - apps/*
  - packages/*

# eslint-plugin-jsx-a11y 6.10 has not widened its peer range to ESLint 10 yet. Its rules run
# correctly on 10 (checked), and ESLint 9 is out of support. Remove once the plugin catches up.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'
    # openapi-typescript 7 declares TypeScript 5; it generates correctly under 6 (checked by
    # pnpm api:check on every run). Remove once it declares 6.
    'openapi-typescript>typescript': '6'
