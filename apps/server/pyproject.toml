[project]
name = "munim-server"
version = "0.1.0"
description = "Munim's server: API, background jobs and the built web app."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "cryptography>=50.0.2",
    "django>=6.1.3",
    "django-ninja>=1.8.0",
    "feedparser>=6.0.14",
    "gunicorn>=27.0.1",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "procrastinate>=3.11.0",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F/I: errors and imports. B: likely bugs. UP: modern syntax. S: security. DJ: Django.
select = ["E", "F", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest is built on assert
"*/migrations/*" = ["E501"]  # generated by Django

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "munim.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "munim.settings"
testpaths = ["tests"]
# A warning is a failure, so deprecations are dealt with when they appear, not when they bite.
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
